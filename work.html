<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KODOWIT Serwis i Projekty 1.0.1</title><link rel="stylesheet" href="shared/site.css"><style>main{max-width:1000px;margin:auto;padding:20px}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:8px;max-width:100%;margin:4px}article{border:1px solid #888;border-radius:12px;padding:16px;margin:12px 0}@media print{form,button,header,select{display:none}}</style><header><a href="business.html">Business</a> · <a href="modules.html">CRM i Magazyn</a></header><main><h1>Serwis i Projekty</h1><p>Prototyp lokalny. Dane nieszyfrowane. Używaj danych testowych.</p><p id="status" role="status"></p><h2>Serwis</h2><form id="service"><label>Klient CRM <select name="client" id="client" required></select></label><label>Zlecenie <input name="name" required maxlength="200"></label><label>Termin <input name="due" type="date" required></label><label>Materiały (grosze) <input name="materials" type="number" min="0" value="0" required></label><label>Robocizna (grosze) <input name="labor" type="number" min="0" value="0" required></label><button>Dodaj zlecenie</button></form><div id="services"></div><h2>Projekty</h2><form id="project"><label>Nazwa <input name="name" required maxlength="200"></label><label>Termin <input name="due" type="date" required></label><label>Budżet (grosze) <input name="budget" type="number" min="0" required></label><button>Dodaj projekt</button></form><div id="projects"></div><button id="print">Drukuj raport</button></main><script src="work-modules.js"></script><script src="work-ui.js"></script><script src="shared/pwa.js"></script></html>
