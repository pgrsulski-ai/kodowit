<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KODOWIT – Kadry i Rezerwacje 1.0.1</title><link rel="stylesheet" href="shared/site.css"><style>main{max-width:950px;margin:auto;padding:16px}form,article{border:1px solid #888;border-radius:12px;padding:12px;margin:12px 0}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:8px;max-width:100%}@media print{form,button,header{display:none}}</style><header><a href="business.html">Business</a> · <a href="modules.html">CRM</a></header><main><h1>Kadry i Rezerwacje</h1><p>Prototyp lokalny, bez szyfrowania. Używaj danych testowych. Nie jest systemem kadrowo-płacowym.</p><p id="status" role="status"></p><h2>Pracownicy</h2><form id="employee"><label>Nazwa pracownika <input name="name" required maxlength="150"></label><label>Stanowisko <input name="role" required maxlength="150"></label><button>Dodaj</button></form><form id="entry"><label>Pracownik <select name="employee" id="employees" required></select></label><label>Data <input name="day" type="date" required></label><label>Rodzaj <select name="kind"><option>Praca</option><option>Urlop</option><option>Nieobecność</option></select></label><label>Minuty pracy (dla pracy) <input name="minutes" type="number" min="0" max="1440" value="480"></label><button>Zapisz wpis</button></form><div id="staffList"></div><h2>Terminarz rezerwacji</h2><form id="booking"><label>Klient CRM <select name="client" id="clients" required></select></label><label>Usługa <input name="service" required maxlength="150"></label><label>Data <input name="day" type="date" required></label><label>Od <input name="start" type="time" required></label><label>Do <input name="end" type="time" required></label><button>Zarezerwuj</button></form><label>Filtr daty <input id="filter" type="date"></label><div id="bookings"></div><button id="print">Drukuj raport</button></main><script src="business/staff.js"></script><script src="business/staff-ui.js"></script><script src="shared/pwa.js"></script></html>
