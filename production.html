<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KODOWIT – Produkcja i Dokumenty 1.0.1</title><link rel="stylesheet" href="shared/site.css"><style>main{max-width:950px;margin:auto;padding:16px}form,article{border:1px solid #888;border-radius:12px;padding:12px;margin:12px 0}label{display:block;margin:8px 0}input,select,button,textarea{font:inherit;padding:8px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media print{form,button,header,select{display:none}}</style><header><a href="business.html">Business</a> · <a href="modules.html">Magazyn</a></header><main><h1>Produkcja i Dokumenty</h1><p>Prototyp lokalny. Planowanie nie zmienia stanów magazynowych. Używaj danych testowych.</p><p id="status" role="status"></p><h2>Receptury</h2><form id="recipe"><label>Nazwa <input name="name" required></label><div id="materials"></div><button type="button" id="add">Dodaj materiał</button><button>Zapisz recepturę</button></form><form id="order"><label>Receptura <select name="recipe" id="recipes" required></select></label><label>Ilość <input name="qty" type="number" min="1" required></label><label>Termin <input name="day" type="date" required></label><button>Zaplanuj produkcję</button></form><div id="orders"></div><h2>Dokumenty</h2><form id="doc"><label>Kategoria <select name="category"><option>Umowa</option><option>Protokół</option><option>Notatka</option><option>Inne</option></select></label><label>Numer <input name="number" required></label><label>Tytuł <input name="title" required></label><label>Termin <input name="day" type="date" required></label><label>Treść <textarea name="body" id="body" required maxlength="10000"></textarea></label><button type="button" id="template">Wstaw szablon protokołu</button><button>Zapisz dokument</button></form><label>Szukaj dokumentu <input id="filter"></label><div id="docs"></div><button id="print">Drukuj raport</button></main><script src="business/production.js"></script><script src="business/production-ui.js"></script><script src="shared/pwa.js"></script></html>
