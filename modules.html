<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KODOWIT CRM i Magazyn 1.0.1</title><link rel="stylesheet" href="shared/site.css"><style>main{max-width:1000px;margin:auto;padding:20px}input,select,button{font:inherit;padding:8px;margin:4px;max-width:100%}article{border:1px solid #888;padding:12px;margin:10px 0;border-radius:10px}label{display:block}@media print{form,button,header,input{display:none}}</style><header><a href="business.html">Business</a></header><main><h1>CRM i Magazyn</h1><p>Prototyp lokalny. Dane nieszyfrowane; używaj danych testowych. Moduły niezależne od ewidencji Buildera.</p><p id="status" role="status"></p><h2>CRM</h2><form id="client"><label>Nazwa <input name="name" required maxlength="200"></label><label>Kontakt <input name="contact" maxlength="200"></label><button>Dodaj klienta</button></form><label>Szukaj klientów i produktów <input id="filter"></label><div id="clients"></div><h2>Magazyn</h2><form id="product"><label>Produkt <input name="name" required maxlength="200"></label><label>Cena w groszach <input name="price" type="number" min="0" step="1" required></label><label>Stan minimalny <input name="min" type="number" min="0" step="1" required></label><button>Dodaj produkt</button></form><div id="products"></div><button id="print">Drukuj raport</button><p><a href="work.html">Serwis i Projekty</a></p></main><script src="business/business-modules.js"></script><script src="modules-ui.js"></script><script src="shared/pwa.js"></script></html>
